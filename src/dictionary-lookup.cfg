// Native macOS "Look Up" in the context menu. First line is skipped by autoconfig.
// Runs as privileged JS at startup; it only loads the module and never throws,
// so a Firefox change can at worst hide the menu item, not break the browser.
try {
  const resource = Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler);
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("dictionary-lookup");
  resource.setSubstitution("dictionary-lookup", Services.io.newFileURI(dir));
  ChromeUtils.importESModule(
    "resource://dictionary-lookup/DictionaryLookup.sys.mjs"
  ).DictionaryLookup.init();
} catch (e) {
  Cu.reportError(e);
}
